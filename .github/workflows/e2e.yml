name: Firefox visual CI

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: e2e-${{ github.ref }}
  cancel-in-progress: true

jobs:
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Checkout (full history for the unpatched negative control)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: |
            package-lock.json
            ci/package-lock.json

      # Everything below is driven by ci/run.sh: occ/WebDAV/OCS for setup,
      # real Firefox in the pinned Playwright image for visual verification.
      - name: Run full matrix, compatibility checks and negative control
        run: ci/run.sh all

      - name: Upload browser reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            ci/playwright-report
            ci/test-results
          if-no-files-found: ignore
